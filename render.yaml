services:
  - type: web
    name: intellixy-api
    runtime: node
    rootDir: apps/api
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: WEB_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_VISION_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_WEB_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_WEB_FALLBACK_MODEL
        value: openai/gpt-oss-20b
